# Public Android payment configuration; safe to commit.
# Merchant passwords and RSA private keys MUST stay in backend secrets.
# Keep disabled until the real backend, merchant activation and legal pages are ready.
# Override with Gradle -Ppayment.<name> or the DIET_PAYMENT_* CI environment variables.
payment.enabled=false
payment.apiBaseUrl=
# Standard base64 of the RSA X.509 SPKI public DER key, no PEM header or line breaks.
payment.publicKeyBase64=
# Region/store eligibility is verified by the server before showing a checkout button.
# Release builds refuse test-mode checkout even if a server returns available=true.
